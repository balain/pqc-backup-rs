name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz header decoder
        run: cargo fuzz run decode-header -- -runs=1000
      - name: Fuzz root-key decoder
        run: cargo fuzz run decode-root-key -- -runs=1000
      - name: Fuzz frame traversal
        run: cargo fuzz run frame-traversal -- -runs=1000

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fuzz-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release asset
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/pqbackup-${{ github.ref_name }}-linux-x86_64.tar.gz" pqbackup
          sha256sum "dist/pqbackup-${{ github.ref_name }}-linux-x86_64.tar.gz" > "dist/pqbackup-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/pqbackup-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            "dist/pqbackup-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "pqbackup ${{ github.ref_name }}"
