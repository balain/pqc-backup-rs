name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release binary
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pqbackup-${{ github.ref_name }}-linux-x86_64
          path: target/release/pqbackup
          if-no-files-found: error

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz header decoder
        run: cargo fuzz run decode-header -- -runs=1000
      - name: Fuzz root-key decoder
        run: cargo fuzz run decode-root-key -- -runs=1000
      - name: Fuzz frame traversal
        run: cargo fuzz run frame-traversal -- -runs=1000
