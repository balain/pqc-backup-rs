name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned dependency policy tool
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check advisories, licenses, dependency policy, and sources
        run: cargo deny check advisories bans licenses sources

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-14 --profile minimal

      - name: Install pinned fuzzing tool
        run: cargo +nightly-2026-07-14 install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz header decoder
        run: cargo +nightly-2026-07-14 fuzz run decode-header -- -runs=1000
      - name: Fuzz root-key decoder
        run: cargo +nightly-2026-07-14 fuzz run decode-root-key -- -runs=1000
      - name: Fuzz frame traversal
        run: cargo +nightly-2026-07-14 fuzz run frame-traversal -- -runs=1000
      - name: Fuzz inventory decoder
        run: cargo +nightly-2026-07-14 fuzz run decode-inventory -- -runs=1000

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, supply-chain, fuzz-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install target
        run: rustup target add "${{ matrix.target }}"

      - name: Build twice and compare
        run: |
          ./scripts/verify-release-build.sh \
            "${{ matrix.target }}" \
            "dist/pqbackup"

      - name: Package binary
        env:
          COPYFILE_DISABLE: "1"
        run: |
          tar -C dist -czf \
            "dist/pqbackup-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" \
            pqbackup
          rm dist/pqbackup

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download platform binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Preserve Sigstore trusted roots for offline verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation trusted-root > \
            "dist/pqbackup-${{ github.ref_name }}-trusted-root.jsonl"

      - name: Build and validate offline recovery kit
        run: ./scripts/build-recovery-kit.sh "${{ github.ref_name }}" dist

      - name: Attest release assets and manifests
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Preserve detached provenance bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "dist/pqbackup-${{ github.ref_name }}-provenance.sigstore.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "pqbackup ${{ github.ref_name }}"
